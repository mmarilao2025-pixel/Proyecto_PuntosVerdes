<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar Producto</title>
</head>
<body>
  <form action="/productos/actualizar/{{producto.id}}">
    {% csrf_token %}
    <label for="nombre">[translate:Nombre:]</label>
    <input type="text" id="nombre" name="nombre">
    <label for="descripcion">[translate:Descripcion:]</label>
    <input type="text" id="descripcion" name="descripcion">
    <label for="cantidad">[translate:Cantidad:]</label>
    <input type="number" id="cantidad" name="cantidad">
    <input type="submit" value="[translate:Actualizar]">
  </form>
</body>
</html>
